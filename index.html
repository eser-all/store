<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্টোর ডাটা রিসেট বা ডিলিট টুল</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-box { max-width: 450px; width: 100%; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

<div class="container">
  <div class="card card-box p-4 bg-white text-center mx-auto">
    <div class="mb-3">
      <i class="fa-solid fa-triangle-exclamation fa-3x text-danger mb-2"></i>
      <h4 class="fw-bold text-danger">স্টোর ডাটা ক্লিয়ার বা ডিলিট</h4>
      <p class="text-muted small">সাবধান! এই বাটনে ক্লিক করলে ফায়ারবেস থেকে আপনার সিলেক্ট করা জোনের সমস্ত পুরোনো ট্রানজাকশন বা ডাটা স্থায়ীভাবে মুছে যাবে।</p>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold small">জোন সিলেক্ট করুন:</label>
      <select id="targetZone" class="form-select fw-bold">
        <option value="Gawar">গাওয়ার জোন (Gawar)</option>
        <option value="Mollartek">মোল্লারটেক জোন (Mollartek)</option>
      </select>
    </div>

    <button onclick="clearAllData()" class="btn btn-danger fw-bold py-2 w-100 shadow-sm">
      <i class="fa-solid fa-trash-can me-2"></i> সমস্ত ডাটা এক ক্লিকে ডিলিট করুন
    </button>
    
    <div id="statusMessage" class="mt-3 small fw-bold"></div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // আপনার ফায়ারবেস কনফিগারেশন
  const firebaseConfig = {
    apiKey: "AIzaSyAVj1wFqK5ZJ86aimbFJvdzbSbfBu6EH6g",
    authDomain: "store-91df0.firebaseapp.com",
    projectId: "store-91df0",
    storageBucket: "store-91df0.firebasestorage.app",
    messagingSenderId: "306926140347",
    appId: "1:306926140347:web:c518359f06163d7ed7a29e",
    measurementId: "G-0P51G2JWPK"
  };

  firebase.initializeApp(firebaseConfig);
  const _db = firebase.database();

  async function clearAllData() {
    const zone = document.getElementById('targetZone').value;
    const statusEl = document.getElementById('statusMessage');
    
    let confirmDelete = confirm(`আপনি কি নিশ্চিতভাবে ${zone === 'Gawar' ? 'গাওয়ার জোন' : 'মোল্লারটেক জোন'}-এর সমস্ত ডাটা ডিলিট করতে চান?`);
    if (!confirmDelete) return;

    statusEl.className = "mt-3 small fw-bold text-info";
    statusEl.innerText = "ডিলিট হচ্ছে, দয়া করে অপেক্ষা করুন...";

    try {
      // নির্দিষ্ট জোনের transactions নোড পুরোপুরি রিমুভ করা
      await _db.ref(`common_store/zones/${zone}/transactions`).remove();
      statusEl.className = "mt-3 small fw-bold text-success";
      statusEl.innerText = "সফলভাবে সমস্ত ডাটা মুছে ফেলা হয়েছে!";
    } catch (error) {
      statusEl.className = "mt-3 small fw-bold text-danger";
      statusEl.innerText = "সমস্যা হয়েছে: " + error.message;
    }
  }
</script>

</body>
</html>
